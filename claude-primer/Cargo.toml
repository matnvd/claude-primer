[package]
name = "claude-primer"
version = "0.1.0"
edition = "2021"
description = "Align Claude Code's 5-hour usage windows to your workday"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = true
